<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LOE Dashboard Login Page</title>
    <link rel="stylesheet" type="text/css" media="all" th:href="@{/css/styles.css}" />
</head>
<body>
<!-- Header -->
<header>
    <h1 class="title">LOE Dashboard <span id="timedate" th:text="${#dates.format(#dates.createNow(),'dd-MM-yyyy')}"></span></h1>
</header>
<!-- Error Message -->
<div th:if="${param.error}" class="message error">
    Invalid username and password.
</div>

<!-- Logout Message -->
<div th:if="${param.logout}" class="message logout">
    You have been logged out.
</div>

<!-- Login Form -->
<form th:action="@{/login}" method="post" class="login-form">
    <div class="form-group">
        <label> User Name:
            <input type="text" name="username" />
        </label>
    </div>
    <div class="form-group">
        <label> Password:
            <input type="password" name="password" />
        </label>
    </div>
    <div class="form-group">
        <input type="submit" value="Sign In" class="submit-btn" />
    </div>
</form>
</body>
</html>
